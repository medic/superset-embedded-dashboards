apiVersion: apps/v1
kind: Deployment
metadata:
  name: cha-dashboard-portal
  labels:
    app: cha-dashboard-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cha-dashboard-portal
  template:
    metadata:
      labels:
        app: cha-dashboard-portal
    spec:
      containers:
        - name: portal
          image: cha-dashboard-portal:latest
          ports:
            - containerPort: 3000
          env:
            - name: CHT_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: cha-dashboard-secrets
                  key: cht-domain
            - name: SUPERSET_URL
              valueFrom:
                secretKeyRef:
                  name: cha-dashboard-secrets
                  key: superset-url
            - name: NEXT_PUBLIC_SUPERSET_URL
              valueFrom:
                configMapKeyRef:
                  name: cha-dashboard-config
                  key: superset-public-url
            - name: SUPERSET_USERNAME
              valueFrom:
                secretKeyRef:
                  name: cha-dashboard-secrets
                  key: superset-username
            - name: SUPERSET_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cha-dashboard-secrets
                  key: superset-password
            - name: COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: cha-dashboard-secrets
                  key: cookie-secret
            - name: DASHBOARDS
              valueFrom:
                configMapKeyRef:
                  name: cha-dashboard-config
                  key: dashboards
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
